version: 2
updates:
  # npm/pnpm lockfile-based updates (minor & patch grouped)
  # GitHub Dependabot uses package-ecosystem "npm" for pnpm-lock.yaml as well.
  - package-ecosystem: "npm"
    directory: "app/"
    schedule:
      interval: "monthly"
    groups:
      minor-patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # npm/pnpm lockfile-based updates (major only, separate PRs)
  - package-ecosystem: "npm"
    directory: "app/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
